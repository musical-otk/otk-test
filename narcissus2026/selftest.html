<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>SELFTEST</title>
<style>
  body{font-family:'Apple SD Gothic Neo',sans-serif;max-width:820px;margin:0 auto;padding:20px;background:#F4F1F7;color:#2A2230;}
  h1{font-size:18px;margin:0 0 4px;}
  .sub{font-size:12px;color:#5E5468;margin-bottom:14px;}
  #summary{font-weight:700;font-size:15px;padding:10px 14px;border-radius:10px;margin-bottom:12px;}
  .ok{background:#DFF3EA;color:#12603F;}
  .bad{background:#FBE3E3;color:#8C2020;}
  .grp{font-weight:700;font-size:13px;margin:14px 0 6px;color:#4E3470;}
  .row{display:flex;gap:8px;padding:5px 8px;border-bottom:1px solid #E1DAE8;font-size:13px;align-items:flex-start;}
  .tag{flex-shrink:0;width:52px;font-weight:700;}
  .p{color:#12603F;} .f{color:#8C2020;}
  .name{flex:1;}
  .detail{font-size:11px;color:#8C2020;white-space:pre-wrap;}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none;}
</style>
</head>
<body>
<h1>⛪ 나르치스와 골드문트 관극 다이어리 — 셀프 검사</h1>
<div class="sub">index.html 을 iframe 으로 실제 로드해 내부 상태를 직접 검증합니다. (TEST_PLAN.md L2 계층)</div>
<div id="summary">실행 중…</div>
<div id="results"></div>
<iframe id="app" src="./index.html"></iframe>

<script>
const results = [];
let W = null;

function t(group, name, fn) { results.push({ group, name, fn }); }
function eq(a, b, msg) {
  const A = JSON.stringify(a), B = JSON.stringify(b);
  if (A !== B) throw new Error((msg ? msg + ' — ' : '') + `기대 ${B}, 실제 ${A}`);
}
function ok(cond, msg) { if (!cond) throw new Error(msg || '조건 실패'); }

// 최상위 const/let 은 window 속성이 되지 않으므로 iframe 스코프에서 eval 로 읽는다
const g = n => W.eval(n);

// 시나리오마다 저장소를 비워 순서 의존성을 없앤다.
// 단, fetch 로 받아온 schedule/events 는 남긴다 (지우면 이후 데이터 검사가 깨진다)
const KEEP = ['narcissus_schedule', 'narcissus_events'];

// ── 실제 기록 보호 ──
// 테스트는 시나리오마다 저장소를 비운다(reset). 이 페이지는 앱과 같은 주소 = 같은 저장소라서,
// 앱을 쓰는 브라우저로 열면 그 앱 기록이 지워진다. 그래서 실행 전에 통째로 백업했다가 끝나면 되돌린다.
// 도중에 창이 닫혀도 백업은 접두사 밖 키에 남아 있어, 다음에 이 페이지를 열면 그것부터 되돌린다.
// 허브 기록 가져오기 검사는 허브 키(hub_rec_narcissus2026 · hub_notes)도 건드리므로 함께 백업한다.
const PREFIX = KEEP[0].slice(0, KEEP[0].indexOf('_') + 1);
const BACKUP_KEY = 'selftest_backup_' + PREFIX;
const HUB_KEYS = ['hub_rec_narcissus2026', 'hub_notes', 'test_hub_rec_narcissus2026', 'test_hub_notes'];
const mine = k => k.startsWith(PREFIX) || HUB_KEYS.includes(k);
function snapshot(ls) {
  const o = {};
  Object.keys(ls).filter(mine).forEach(k => { o[k] = ls.getItem(k); });
  return o;
}
function restore(ls, o) {
  Object.keys(ls).filter(mine).forEach(k => ls.removeItem(k));
  Object.entries(o).forEach(([k, v]) => ls.setItem(k, v));
}
(function recoverLeftover() {
  const left = localStorage.getItem(BACKUP_KEY);
  if (!left) return;
  try { restore(localStorage, JSON.parse(left)); } catch (e) {}
  localStorage.removeItem(BACKUP_KEY);
})();
async function guardedRun() {
  // 배포 주소에서는 한 번 더 묻는다 (배포 후 확인은 ?live=1 로 빈 브라우저에서 돌린다)
  const live = /github\.io$/.test(location.hostname) && !/[?&]live=1\b/.test(location.search);
  if (live && !window.confirm('테스트용 페이지입니다.\n이 브라우저의 관람 기록은 백업했다가 끝나면 되돌리지만,\n실행 중에 창을 닫으면 이 페이지를 다시 열어야 복구됩니다.\n\n계속할까요?')) {
    document.getElementById('summary').textContent = '실행하지 않았습니다';
    return;
  }
  const saved = snapshot(localStorage);
  localStorage.setItem(BACKUP_KEY, JSON.stringify(saved));
  try { await run(); }
  finally { restore(localStorage, saved); localStorage.removeItem(BACKUP_KEY); }
}
function reset() {
  const ls = W.localStorage;
  Object.keys(ls)
    .filter(k => k.startsWith(PREFIX) && !KEEP.includes(k))
    .forEach(k => ls.removeItem(k));
}
function boards() { return W.getStampBoards(); }
function newBoard(name) {
  const bs = boards();
  const b = { id: W.uuid(), name: String(name), totalSlots: g('DEFAULT_SLOTS'),
              milestones: W.defaultMilestones(), currentCount: 0, history: [] };
  bs.push(b); W.saveStampBoards(bs);
  return b.id;
}
function countOf(id) { const b = boards().find(x => x.id === id); return b ? b.currentCount : null; }
function fill(id, n) { W.applyStampToBoard(id, n, '2026-12-22', '테스트'); W.applyStampToBoard._lastOverflow = 0; }

// 1회차뿐인 날 (화요일 12/22 20:00 — 첫공, 문성일·김현진)
const D1 = '2026-12-22', T1 = '20:00';

// ── E. 개조 정합성 ────────────────────────────────────
t('E. 개조 정합성', 'ROLES 가 날골 2배역', () => {
  eq(g('ROLES').map(r => r.key), ['narziss','goldmund']);
  eq(g('ROLES').map(r => r.label), ['나르치스','골드문트']);
});
t('E. 개조 정합성', '5주년 캐스트 11명 (나르치스 6 · 골드문트 5)', () => {
  eq(g('ROLES')[0].actors, ['문성일','임별','박유덕','최호승','유승현','안재영']);
  eq(g('ROLES')[1].actors, ['김현진','동현','박경호','김지온','강찬']);
  const all = g('ROLES').flatMap(r => r.actors);
  eq(new Set(all).size, 11, '배우 중복 없음');
});
t('E. 개조 정합성', '기록 폼 배우 목록이 ROLES 와 같다', () => {
  const d = W.document;
  g('ROLES').forEach(r => {
    const opts = [...d.getElementById('rec-' + r.key).options].map(o => o.value).filter(Boolean);
    eq(opts, r.actors, r.label);
  });
});
t('E. 개조 정합성', '다른 작품 배역의 입력이 남아있지 않음', () => {
  const d = W.document;
  ['jaei','wooyoung','achilles','patroclus','hector','marco','soma','yuo','uiju','eunhui'].forEach(k =>
    ok(!d.getElementById('rec-' + k), `다른 작품 배역 입력 #rec-${k} 잔존`));
});
t('E. 개조 정합성', '저장소 네임스페이스가 narcissus_', () => {
  eq(g('APP_PREFIX'), 'narcissus_');
});
t('E. 개조 정합성', '배역 라벨 폭이 가장 긴 배역명에 맞춰져 있다', () => {
  const longest = Math.max(...g('ROLES').map(r => r.label.length));
  eq(W.roleLabelWidth(), `calc(${longest}em + 2px)`, "'전체' 칩 시작 위치가 어긋나면 안 됨");
  eq(longest, 4, '나르치스·골드문트 모두 4글자');
});

// ── U. 좌석 ───────────────────────────────────────────
const rowSeats = (f, r) => g('SEAT_PLAN')[f].def[r].reduce((s, [, a, b]) => s + b - a + 1, 0);
t('U. 좌석', '1층 A~N · 2층 O~T', () => {
  eq(Object.keys(g('SEAT_PLAN')), ['1층', '2층']);
  eq(g('SEAT_PLAN')['1층'].rows, ['A','B','C','D','E','F','G','H','I','J','K','L','M','N']);
  eq(g('SEAT_PLAN')['2층'].rows, ['O','P','Q','R','S','T']);
});
t('U. 좌석', '열별 좌석 수가 판독값과 같다', () => {
  const exp1 = { A:18,B:19,C:19,D:20,E:19,F:20,G:19,H:20,I:20,J:19,K:20,L:20,M:19,N:21 };
  const exp2 = { O:20,P:21,Q:16,R:16,S:16,T:18 };
  Object.entries(exp1).forEach(([r, n]) => eq(rowSeats('1층', r), n, '1층 ' + r));
  Object.entries(exp2).forEach(([r, n]) => eq(rowSeats('2층', r), n, '2층 ' + r));
});
t('U. 좌석', '합계 380석 = 1층 273 + 2층 107', () => {
  const sum = f => g('SEAT_PLAN')[f].rows.reduce((s, r) => s + rowSeats(f, r), 0);
  eq([sum('1층'), sum('2층')], [273, 107]);
});
t('U. 좌석', '번호가 묶음마다 이어지고 겹치지 않으며 24칸 안에 든다', () => {
  ['1층', '2층'].forEach(f => g('SEAT_PLAN')[f].rows.forEach(r => {
    const segs = g('SEAT_PLAN')[f].def[r];
    let next = 1, lastCol = -1;
    segs.forEach(([c, a, b]) => {
      eq(a, next, `${f} ${r}열 번호 끊김`);
      ok(c > lastCol, `${f} ${r}열 칸 겹침`);
      ok(c + (b - a) < g('SEAT_COLS'), `${f} ${r}열 24칸 밖`);
      next = b + 1; lastCol = c + (b - a);
    });
  }));
});
t('U. 좌석', '사석 13석 · 휠체어석 J17~19 · 보유석은 일반석', () => {
  const U = g('SEAT_UNAVAILABLE');
  eq(U['1층'], { A:[1,2,17,18], B:[1,19], C:[1,19] });
  eq(U['2층'], { O:[1,20], P:[1,21], T:[1] });
  eq(Object.values(U).flatMap(o => Object.values(o)).flat().length, 13);
  eq(g('SEAT_WHEELCHAIR'), { '1층': { J:[17,18,19] } });
  ok(!(U['1층'].G || []).length && !(U['1층'].H || []).length, '보유석 G·H 는 표시하지 않는다');
});
t('U. 좌석', 'I·J 사이 한 줄 띄움 · 2층은 없음', () => {
  eq(g('SEAT_PLAN')['1층'].gapAfter, ['I']);
  eq(g('SEAT_PLAN')['2층'].gapAfter, []);
});
t('U. 좌석', '좌석 입력 드롭다운(FLOOR_ROWS)이 좌석도와 일치하고 층끼리 열 문자가 겹치지 않음', () => {
  eq(Object.keys(g('FLOOR_ROWS')), ['1층', '2층']);
  ['1층', '2층'].forEach(f => eq(g('FLOOR_ROWS')[f], g('SEAT_PLAN')[f].rows, f));
  const a = g('FLOOR_ROWS')['1층'], b = g('FLOOR_ROWS')['2층'];
  ok(!a.some(r => b.includes(r)), '열 문자 중복');
});
t('U. 좌석', '히트맵이 380석을 모두 그린다 (사석 13 포함)', () => {
  W.renderHeatmap();
  const cells = [...W.document.querySelectorAll('#heatmap [title]')];
  eq(cells.length, 380);
  eq(cells.filter(c => /사석/.test(c.title)).length, 13);
  eq(cells.filter(c => /휠체어석/.test(c.title)).length, 3);
  eq(W.document.querySelectorAll('#heatmap .hm-row-gap').length, 1, 'I·J 사이 한 줄');
  eq(W.document.querySelectorAll('#heatmap .hm-floor-label').length, 2, '층 라벨 2개');
});
t('U. 좌석', '미니 좌석도가 고른 좌석 하나만 강조 (2층 O20)', () => {
  const html = W.buildMiniSeat('2층', 'O', 20);
  eq((html.match(/box-shadow:0 0 3px/g) || []).length, 1);
  ok(W.buildMiniSeat('1층', 'N', 21).includes('box-shadow'), 'N21 도 그려진다');
});
t('U. 좌석', '2층 T18 은 저장되고 T19 는 막힌다', () => {
  reset();
  const d = W.document;
  W.openAddRecord(D1);
  d.getElementById('rec-time').value = T1;
  d.getElementById('rec-floor').value = '2층'; W.onFloorChange();
  d.getElementById('rec-zone').value = 'T';
  d.getElementById('rec-num').value = '19';
  W.saveRecord();
  eq(W.getRecords().length, 0, 'T19 는 없는 자리');
  d.getElementById('rec-num').value = '18';
  W.saveRecord();
  const r = W.getRecords()[0];
  eq([r.seatFloor, r.seatZone, r.seatNumber], ['2층', 'T', 18]);
});

// ── S. 도장판 (마리아브론 재관람 카드) ─────────────────
t('S. 도장판', '6칸 · 마일스톤 3·6회 (선택지 없음)', () => {
  const ms = W.defaultMilestones();
  eq(ms.map(m => m.at), [3, 6]);
  eq(g('DEFAULT_SLOTS'), 6, '카드는 6칸');
  eq(ms[ms.length - 1].at, g('DEFAULT_SLOTS'), '마지막 마일스톤이 마지막 칸');
  ms.forEach(m => ok(m.choiceRequired === undefined, '보상 선택이 없어야 함'));
  eq(ms[1].reward, '🎧 오디오북 (NFC 키링 · 수령 추후 공지)');
});
t('S. 도장판', '3회 보상은 40%·50% 할인권 각 1장, 6회는 쿠폰 없음', () => {
  const ms = W.defaultMilestones();
  eq([W.msCouponQty(ms[0], 'discount40'), W.msCouponQty(ms[0], 'discount50')], [1, 1]);
  eq([W.msCouponQty(ms[1], 'discount40'), W.msCouponQty(ms[1], 'discount50')], [0, 0]);
  eq([W.msHasCoupon(ms[0]), W.msHasCoupon(ms[1])], [true, false]);
});
t('S. 도장판', '옛 구조(couponKey 하나) 마일스톤도 읽는다', () => {
  eq(W.msCouponQty({ couponKey: 'discount40', qty: 2 }, 'discount40'), 2);
  eq(W.msCouponQty({ couponKey: 'discount40' }, 'discount50'), 0);
});
t('S. 도장판', '3회에 할인권 2종이 함께 생기고 6회에는 더 생기지 않음', () => {
  reset();
  const id = newBoard(1);
  const cnt = k => W.calcCouponCount(k, W.getCoupons(), boards(), W.getRecords());
  fill(id, 2); eq([cnt('discount40'), cnt('discount50')], [0, 0], '2회');
  fill(id, 1); eq([cnt('discount40'), cnt('discount50')], [1, 1], '3회');
  fill(id, 3); eq([cnt('discount40'), cnt('discount50')], [1, 1], '6회 — 오디오북은 쿠폰 아님');
  const b = boards().find(x => x.id === id);
  eq(b.milestones.map(m => m.notified), [true, true]);
});
t('S. 도장판', '리플리식(3·5·7) 판은 날골식(3·6)으로 바뀌고 받은 보상은 유지', () => {
  reset();
  W.saveStampBoards([{ id: 'old', name: '1', totalSlots: 7, currentCount: 3, history: [],
    milestones: [{ at: 3, couponKey: 'discount40', notified: true }, { at: 5, couponKey: 'discount50', notified: false }, { at: 7, couponKey: null, notified: false }] }]);
  const b = boards()[0];
  eq(b.milestones.map(m => m.at), [3, 6]);
  eq(b.milestones[0].notified, true);
  eq(b.milestones[0].coupons.length, 2);
});
t('S. 도장판', 'S8 — 잔여 충분하면 같은 판에 2개', () => {
  reset();
  const id = newBoard(1);
  fill(id, 3);
  W.applyStampToBoard(id, 2, '2026-12-23', '2매');
  eq(W.applyStampToBoard._lastOverflow, 0, '초과분 없어야 함');
  eq(countOf(id), 5);
  eq(boards().length, 1, '새 판이 생기면 안 됨');
});
t('S. 도장판', 'S1 — 잔여 1칸 + 2개 적립 → 1개는 이 판, 1개는 새 판', () => {
  reset();
  const id = newBoard(1);
  fill(id, 5);
  W.applyStampToBoard(id, 2, '2026-12-23', '2매');
  const over = W.applyStampToBoard._lastOverflow;
  eq(over, 1, '초과분');
  eq(countOf(id), 6, '기존 판은 가득 참');
  W.createOverflowBoard(over, '2026-12-23', '2매', '', null);
  eq(boards().length, 2, '새 판 1개 생성');
  const nb = boards().find(b => b.id !== id);
  eq(nb.currentCount, 1, '새 판에 초과분 1개');
  eq(nb.totalSlots, 6, '새 판도 6칸');
});
t('S. 도장판', 'S9 — 초과분이 기존 미완성 판으로 가면 안 됨 (합산 불가)', () => {
  reset();
  const a = newBoard(1), b = newBoard(2);
  fill(b, 2);
  fill(a, 5);
  W.applyStampToBoard(a, 2, '2026-12-23', '2매');
  const over = W.applyStampToBoard._lastOverflow;
  eq(over, 1);
  W.createOverflowBoard(over, '2026-12-23', '2매', '', null);
  eq(countOf(b), 2, '기존 미완성 판은 그대로');
  eq(boards().length, 3, '새 판이 추가로 생성돼야 함');
});
t('S. 도장판', 'S2 — 가득 찬 판에는 더 못 찍음', () => {
  reset();
  const id = newBoard(1);
  fill(id, 6);
  const msg = W.applyStampToBoard(id, 1, '2026-12-25', '테스트');
  ok(/이미 완성/.test(msg || ''), '완성 안내가 나와야 함: ' + msg);
  eq(countOf(id), 6);
});

// ── X. 더블적립 데이 (회차 단위) ───────────────────────
t('X. 더블적립', '더블적립 회차 5개 — 1/10 은 14시만', () => {
  const f = W.isDoubleStampSession;
  eq([f('2027-01-07','20:00'), f('2027-01-08','20:00'), f('2027-01-09','15:00'), f('2027-01-09','19:00'), f('2027-01-10','14:00')],
     [true, true, true, true, true]);
  eq([f('2027-01-10','18:00'), f('2027-01-06','20:00'), f('2027-01-10','')], [false, false, false]);
});
t('X. 더블적립', '더블적립 회차를 고르면 도장 수량 기본값이 2, 다른 회차로 바꾸면 1', () => {
  reset();
  const id = newBoard(1);
  const d = W.document;
  const qty = () => d.querySelector('input[name="rec-stamp-qty"]:checked').value;
  W.openAddRecord('2027-01-10');
  d.getElementById('rec-time').value = '14:00'; W.onTimeChange();
  d.getElementById('rec-stamp-board').value = id; W.onRecStampBoardChange();
  eq(qty(), '2', '1/10 14시');
  eq(d.getElementById('rec-double-hint').style.display, '', '안내 표시');
  d.getElementById('rec-time').value = '18:00'; W.onTimeChange();
  eq(qty(), '1', '1/10 18시');
  eq(d.getElementById('rec-double-hint').style.display, 'none');
  W.closePanel('overlay-record');
});
t('X. 더블적립', '직접 고른 수량은 회차를 바꿔도 덮지 않음', () => {
  reset();
  const id = newBoard(1);
  const d = W.document;
  W.openAddRecord('2027-01-09');
  d.getElementById('rec-time').value = '15:00'; W.onTimeChange();
  d.getElementById('rec-stamp-board').value = id; W.onRecStampBoardChange();

// 폼을 실제로 조작해 saveRecord / deleteCurrentRecord 경로를 그대로 태운다
function addRecordViaForm({ date, time, cast = {}, boardId = '', discount = '', paidDiff = false }) {
  const d = W.document;
  W.openAddRecord(date);
  d.getElementById('rec-time').value = time;
  W.updateDiscountOptions();
  // openAddRecord(date) 는 스케줄에서 캐스팅을 자동 입력한다.
  // 테스트는 의도한 값만 남기려고 전부 비운 뒤 cast 를 적용한다.
  g('ROLES').forEach(r => { d.getElementById('rec-' + r.key).value = ''; });
  Object.entries(cast).forEach(([k, v]) => { d.getElementById('rec-' + k).value = v; });
  if (discount) {
    d.getElementById('rec-discount-type').value = discount;
    ok(d.getElementById('rec-discount-type').value === discount, '할인권종 목록에 없음(기간 밖일 수 있음): ' + discount);
    W.onDiscountTypeChange();
  }
  if (paidDiff) d.getElementById('rec-paid-diff').checked = true;
  if (boardId) {
    const sel = d.getElementById('rec-stamp-board');
    sel.value = boardId;
    ok(sel.value === boardId, '도장판 선택 실패 — 목록에 없음');
    W.onRecStampBoardChange();
  }
  W.saveRecord();
  return W.getRecords();
}
function deleteRecordById(id) {
  W.confirm = () => true;                       // 삭제 확인만 승인
  W.eval('currentDetailId = ' + JSON.stringify(id));
  W.deleteCurrentRecord();
  W.confirm = () => false;                      // 기본값으로 복귀
}

// ── H. 허브 기록 가져오기 ─────────────────────────────
function idb(req) { return new Promise((res, rej) => { req.onsuccess = e => res(e.target.result); req.onerror = e => rej(e.target.error); }); }
t('H. 허브 가져오기', '허브 예매·메모·사진을 앱 기록으로 옮기고 같은 회차는 건너뛴다', async () => {
  reset();
  const ls = W.localStorage, ns = W.hubNs();
  const recKey = ns + 'rec_narcissus2026', notesKey = ns + 'notes';
  const db = await W.openHubPhotoDB();
  const pid = await idb(db.transaction('photos', 'readwrite').objectStore('photos').add('data:image/png;base64,AAAA'));
  const hub = [
    { id: 'x1', date: '2026-12-22', time: '20:00', show: '나르치스와 골드문트', seatZone: '1층 B', seatNumber: 7, price: 42000, status: '', transferTo: '' },
    { id: 'x2', date: '2027-01-05', time: '20:00', seatZone: 'O열', seatNumber: 3, price: null, status: '양도', transferTo: '친구' },
    { id: 'x3', date: '2026-12-23', time: '20:00', seatZone: '가운데', seatNumber: 5, price: null, status: '' },
    { id: 'x4', date: '2026-12-24', time: '20:00', seatZone: 'C', seatNumber: 9, price: null, status: '' }
  ];
  ls.setItem(recKey, JSON.stringify(hub));
  ls.setItem(notesKey, JSON.stringify({
    'show_narcissus2026__2026-12-22__20:00': { memo: '첫공!', photoIds: [pid] },
    'show_narcissus2026__2026-12-27__14:00': { memo: '메모만', photoIds: [] },
    'app_ripley2026__2026-12-23__20:00': { memo: '다른 작품', photoIds: [] }
  }));
  // 이미 앱에 있는 회차 (12/24 20:00) — 건너뛰어야 함
  W.saveRecords([{ id: 'mine', date: '2026-12-24', time: '20:00', status: '관람', isBooked: true, narziss: '박유덕', goldmund: '박경호' }]);
  const added = [];
  try {
    const res = await W.importHubRecords();
    eq([res.imported, res.skipped, res.notesCopied], [3, 1, 2], '가져옴·건너뜀·메모 복사');
    const recs = W.getRecords();
    eq(recs.length, 4);
    const r1 = recs.find(r => r.date === '2026-12-22');
    eq([r1.seatFloor, r1.seatZone, r1.seatNumber, r1.price], ['1층', 'B', 7, 42000]);
    eq([r1.narziss, r1.goldmund], ['문성일', '김현진'], '캐스팅은 스케줄에서');
    eq([r1.status, r1.memo, r1.importedFrom], ['관람', '첫공!', 'hub:x1']);
    const r2 = recs.find(r => r.date === '2027-01-05');
    eq([r2.seatFloor, r2.seatZone, r2.seatNumber, r2.status, r2.transferTo], ['2층', 'O', 3, '양도', '친구']);
    const r3 = recs.find(r => r.date === '2026-12-23');
    eq([r3.seatFloor, r3.seatZone], [null, null], '알 수 없는 좌석 칸은 비운다');
    ok(/허브 좌석: 가운데/.test(r3.memo), '원래 좌석 글은 메모로');
    eq(recs.filter(r => r.date === '2026-12-24').map(r => r.id), ['mine'], '같은 회차는 그대로');
    const photos = await W.dbGetPhotos(r1.id);
    eq(photos.map(p => p.dataUrl), ['data:image/png;base64,AAAA'], '사진도 앱으로');
    const notes = JSON.parse(ls.getItem(notesKey));
    ok(notes['show_narcissus2026__2026-12-22__20:00'], '허브 원본 메모는 남는다');
    const nn = notes['app_narcissus2026__2026-12-22__20:00'];
    ok(nn && nn.memo === '첫공!' && nn.photoIds.length === 1 && nn.photoIds[0] !== pid, '앱 키로 복사, 사진은 새 id');
    added.push(...nn.photoIds);
    eq(notes['app_narcissus2026__2026-12-27__14:00'].memo, '메모만', '기록 없는 회차 메모도 복사');
    ok(!notes['app_narcissus2026__2026-12-23__20:00'], '다른 작품 메모는 건드리지 않음');
    eq(JSON.parse(ls.getItem(recKey)).length, 4, '허브 원본 기록은 지우지 않는다');
    // 두 번째 실행은 아무것도 하지 않는다
    eq(await W.importHubRecords(), null, '한 번만');
    eq(W.getRecords().length, 4, '중복 없음');
  } finally {
    const st = db.transaction('photos', 'readwrite').objectStore('photos');
    [pid, ...added].forEach(id => st.delete(id));
    (await W.dbGetAllPhotos()).forEach(p => W.dbDeletePhoto(p.id));
    db.close();
  }
});
t('H. 허브 가져오기', '허브 기록이 없으면 표시만 남기고 아무것도 안 한다', async () => {
  reset();
  const ls = W.localStorage, ns = W.hubNs();
  ls.removeItem(ns + 'rec_narcissus2026');
  ls.setItem(ns + 'notes', JSON.stringify({}));
  eq(await W.importHubRecords(), null);
  eq(W.getRecords().length, 0);
  ok(g('DB').get('hubImport_' + ns, null), '다시 보지 않게 표시');
});
t('H. 허브 가져오기', '허브 좌석 칸 해석 — 열 문자로 층을 정한다', () => {
  const p = (z, n) => { const r = W.parseHubSeat(z, n); return [r.seatFloor, r.seatZone, r.seatNumber]; };
  eq(p('B', 7), ['1층', 'B', 7]);
  eq(p('2층 r', 16), ['2층', 'R', 16]);
  eq(p('T열', 19), ['2층', 'T', null], '없는 번호는 비운다');
  eq(p('', null), [null, null, null]);
});

// ── D. 데이터 ─────────────────────────────────────────

  const s = W.getSchedule();
  eq(s.length, 27);
  ok(s.every(x => g('ROLES').every(r => x[r.key])), '모든 회차에 2배역');
  const d = s.map(x => x.date).sort();
  eq([d[0], d[d.length - 1]], ['2026-12-22', '2027-01-10']);

t('D. 데이터', '배우별 회차 수가 재공지 표와 같다', () => {
  const s = W.getSchedule();
  const cnt = (k, a) => s.filter(x => x[k] === a).length;

  eq(['김현진','동현','박경호','김지온','강찬'].map(a => cnt('goldmund', a)), [7, 7, 8, 5, 0]);
});
t('D. 데이터', '재공지에서 바뀐 두 회차 (1/8 20시 박경호, 1/9 15시 동현)', () => {
  const s = W.getSchedule();
  eq(s.find(x => x.date === '2027-01-08').goldmund, '박경호');
  eq(s.find(x => x.date === '2027-01-09' && x.time === '15:00').goldmund, '동현');

t('D. 데이터', '월요일 공연이 없음', () => {
  eq(W.getSchedule().filter(s => new Date(s.date + 'T00:00:00').getDay() === 1).map(s => s.date), []);

t('D. 데이터', '공연시간 — 12/23 20시 1회 · 12/25 18시 1회 · 수 16·20 · 토 15·19 · 일 14·18', () => {
  const byDate = {};
  W.getSchedule().forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s.time); });
  eq(byDate['2026-12-23'], ['20:00']);
  eq(byDate['2026-12-25'], ['18:00']);
  eq(byDate['2026-12-30'], ['16:00', '20:00']);
  eq(byDate['2026-12-26'], ['15:00', '19:00']);
  eq(byDate['2026-12-27'], ['14:00', '18:00']);
  eq(byDate['2027-01-01'], ['14:00', '18:00']);
});
t('D. 데이터', '달력 기준월 — 개막 전엔 2026년 12월, 이후엔 이번 달', () => {
  W.initCal();
  const today = W.localDate();
  const exp = today < '2026-12-22' ? [2026, 11] : [+today.slice(0, 4), +today.slice(5, 7) - 1];
  eq([g('calYear'), g('calMonth')], exp, '0-indexed 월');
});

// ── B. 6개 앱 리뷰 회귀 (도장 손실·숨은 체크·가득 찬 판) ─────────────
function firstSession() { const s = W.getSchedule()[0]; return { date: s.date, time: s.time }; }

t('B. 회귀', 'B1 — 양도로 바꿔도 같은 날 다른 기록의 도장은 남음', () => {
  reset();
  const id = newBoard(1);
  const { date, time } = firstSession();
  addRecordViaForm({ date, time, boardId: id });
  const recs = addRecordViaForm({ date, time, boardId: id });
  eq(recs.length, 2, '같은 회차 두 장');
  const r0 = recs[0], r1 = recs[1];
  ok(boards().find(b => b.id === id).history.every(h => h.recordId), '두 도장 모두 기록과 연결');
  W.editRecord(r0.id);
  W.document.getElementById('rec-transferred').checked = true;
  W.onRecTransferredChange();
  W.saveRecord();
  const hist = boards().find(b => b.id === id).history;
  ok(!hist.some(h => h.recordId === r0.id), '양도한 기록의 도장은 회수');
  ok(hist.some(h => h.recordId === r1.id), '다른 기록의 도장은 남아야 함');
});
t('B. 회귀', 'B2 — 도장이 오버플로우 판에만 있는 기록을 지워도 같은 날 다른 기록 도장은 남음', () => {
  reset();
  const a = newBoard(1), b = newBoard(2);
  const { date, time } = firstSession();
  const bs = boards();
  bs.find(x => x.id === a).history = [{ date, method: '테스트 관람 연동', comment: '', qty: 1, recordId: 'R2' }];
  bs.find(x => x.id === b).history = [{ date, method: '테스트 관람 연동', comment: '', qty: 1, recordId: 'R1' }];
  bs.forEach(x => W.recalcStampCount(x));
  W.saveStampBoards(bs);
  const base = { date, time, isBooked: true, status: '관람' };
  W.saveRecords([{ id: 'R1', ...base, stampBoardId: a, stampQty: 1 }, { id: 'R2', ...base, stampBoardId: a, stampQty: 1 }]);
  deleteRecordById('R1');
  const ha = boards().find(x => x.id === a).history;
  ok(ha.some(h => h.recordId === 'R2'), 'R2 의 도장이 지워지면 안 됨');
  eq(boards().find(x => x.id === b).history.length, 0, 'R1 의 도장은 회수');
});
t('B. 회귀', 'B3 — 증빙·차액 체크가 숨겨진 채 남아 저장되지 않음', () => {
  reset();
  const { date, time } = firstSession();
  const d = W.document;
  const proof = W.eval("(typeof PROOF_PASS_DISCOUNTS !== 'undefined' ? PROOF_PASS_DISCOUNTS : typeof DISCOUNT_NEEDS_PROOF !== 'undefined' ? [...DISCOUNT_NEEDS_PROOF] : Object.keys(DISCOUNT_COUPON_MAP))[0]");
  W.openAddRecord(date);
  d.getElementById('rec-time').value = time;
  d.getElementById('rec-discount-type').value = proof;
  ok(d.getElementById('rec-discount-type').value === proof, '증빙 필요 할인이 목록에 있어야 함: ' + proof);
  W.onDiscountTypeChange();
  d.getElementById('rec-paid-diff').checked = true;
  const eb = d.getElementById('rec-eungbing-used');
  if (eb) eb.checked = true;
  d.getElementById('rec-discount-type').value = '정가';
  W.onDiscountTypeChange();
  W.saveRecord();
  const r = W.getRecords()[0];
  ok(r, '저장돼야 함');
  eq(r.paidDiff, false, '정가로 바꾸면 차액 지불은 꺼져야 함');
  ok(!r.eungBingPassUsed, '정가로 바꾸면 증빙패스 사용은 꺼져야 함');
});
t('B. 회귀', 'B9 — 그 사이 가득 찬 판에 저장해도 다른 기록의 도장 id 를 덮어쓰지 않음', () => {
  reset();
  const id = newBoard(1);
  fill(id, 5);
  const { date, time } = firstSession();
  const d = W.document;
  W.openAddRecord(date);
  d.getElementById('rec-time').value = time;
  const q1 = d.querySelector('input[name="rec-stamp-qty"][value="1"]');
  if (q1) q1.checked = true;
  const sel = d.getElementById('rec-stamp-board');
  sel.value = id; W.onRecStampBoardChange();
  fill(id, 1);                       // 폼을 연 사이 판이 가득 참
  W.saveRecord();
  const rec = W.getRecords()[0];
  ok(rec, '기록은 저장돼야 함');
  const hist = boards().find(b => b.id === id).history;
  ok(hist.every(h => !h.recordId), '기존 이력에 recordId 가 붙으면 안 됨');
  eq(rec.stampBoardId, null, '도장이 안 들어갔으니 연동은 풀려야 함');
});

// ── 실행 ──────────────────────────────────────────────
async function run() {
  let pass = 0, fail = 0;
  const out = document.getElementById('results');
  let lastGroup = null;
  for (const r of results) {
    if (r.group !== lastGroup) {
      const gEl = document.createElement('div');
      gEl.className = 'grp'; gEl.textContent = r.group;
      out.appendChild(gEl); lastGroup = r.group;
    }
    let err = null;
    try { await r.fn(); pass++; } catch (e) { err = e.message || String(e); fail++; }
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="tag ${err ? 'f' : 'p'}">${err ? 'FAIL' : 'PASS'}</span>`
                  + `<span class="name">${r.name}${err ? `<div class="detail">${err}</div>` : ''}</span>`;
    out.appendChild(row);
  }
  const sum = document.getElementById('summary');
  sum.className = fail ? 'bad' : 'ok';
  sum.textContent = `RESULT ${pass} passed, ${fail} failed`;
  document.title = `SELFTEST ${pass} passed ${fail} failed`;
}

const frame = document.getElementById('app');
frame.addEventListener('load', () => {
  W = frame.contentWindow;
  // schedule.json / events.json fetch 가 끝날 시간을 준다
  const start = Date.now();
  (function wait() {
    const ready = W.getSchedule && W.getSchedule().length > 0 && W.getEvents().length > 0;
    if (ready || Date.now() - start > 6000) {
      // headless 에는 confirm 에 답할 사람이 없어 영원히 멈춘다. 기본 거절로 스텁한다.
      W.confirm = () => false;
      W.alert   = () => {};
      // 앱이 열릴 때 돈 허브 가져오기가 끝날 틈을 준다
      setTimeout(guardedRun, 300);
    } else setTimeout(wait, 150);
  })();
});
